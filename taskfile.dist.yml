# https://taskfile.dev

version: '3'

vars:
  FLAKEHUB_TOKEN_URL: https://flakehub.com/token/create?description=Determinate+NixD+on+Nobilissimum

  GO_VERSION: 1.25
  NODE_VERSION: 22

tasks:
  # --------------------------------------
  # Header
  # --------------------------------------

  default:
    cmds:
      - task: help

  help:
    desc: Show available tasks
    cmds:
      - task --list
    silent: true

  nix-login:
    desc: Login to Nix package repository. You may create a token at {{.FLAKEHUB_TOKEN_URL}}
    cmds:
      - determinate-nixd login

  nix-setup:
    desc: Setup machine using Nix flake for Home Manager
    cmds:
      - nix run home-manager -- switch --flake ./home-manager/#nobi --impure -b backup

  nix-update:
    desc: Update nix lock
    cmds:
      - nix flake update --flake ./home-manager

  setup:
    desc: Run setup commands
    cmds:
      - task: bat-setup
      - task: git-setup
      - task: mise-setup
      - task: ssh-setup

  # --------------------------------------
  # Body
  # --------------------------------------

  bat-setup:
    desc: Build bat to detect custom theme
    cmds:
      - bat cache --build

  git-setup:
    desc: Setup global git configurations
    cmds:
      - touch ~/.gitignore
      - git config --global core.excludesfile ~/.gitignore
      - git config --global core.pager delta
      - git config --global delta.features hush
      - git config --global delta.navigate true
      - git config --global delta.dark true
      - git config --global delta.syntax-theme 'Hush'
      - git config --global --fixed-value --get include.path ~/.config/delta/hush.gitconfig || git config --global --add include.path ~/.config/delta/hush.gitconfig
      - git config --global interactive.diffFilter 'delta --color-only'
      - git config --global merge.conflictStyle zdiff3

  mise-setup:
    desc: Setup tools using mise (~/.config/mise/config.toml)
    cmds:
      - mise install

  mise-go-install:
    desc: Install Golang using mise
    cmds:
      - mise install go@{{.GO_VERSION}}

  mise-go-uninstall:
    desc: Uninstall Golang using mise
    cmds:
      - mise uninstall go@{{.GO_VERSION}}

  mise-go-ls:
    desc: List installed Golang versions
    cmds:
      - mise ls go

  mise-go-ls-remote:
    desc: List Golang versions ready for installation
    cmds:
      - mise ls-remote go

  mise-go-use-global:
    desc: Set global Golang version
    cmds:
      - mise use --global go@{{.GO_VERSION}}

  mise-go-use-local:
    desc: Set local Golang version. This would create .mist.toml
    cmds:
      - mise use go@{{.GO_VERSION}}

  mise-go-use-shell:
    desc: Set Golang version for the current session
    cmds:
      - mise shell go@{{.GO_VERSION}}

  ssh-setup:
    desc: Setup SSH config
    cmds:
      - cp ./.ssh/config $HOME/.ssh/config
