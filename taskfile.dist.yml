# https://taskfile.dev

version: '3'

vars:
  FLAKEHUB_TOKEN_URL: https://flakehub.com/token/create?description=Determinate+NixD+on+Nobilissimum

  GO_VERSION: 1.25
  NODE_VERSION: 22

tasks:
  default:
    cmds:
      - task: help

  help:
    desc: Show available tasks
    cmds:
      - task --list
    silent: true

  nix-login:
    desc: Login to Nix package repository. You may create a token at {{.FLAKEHUB_TOKEN_URL}}
    cmds:
      - determinate-nixd login

  nix-setup:
    desc: Setup machine using Nix flake for Home Manager
    cmds:
      - nix run home-manager -- switch --flake ./home-manager/#nobi --impure -b backup

  nix-update:
    desc: Update nix lock
    cmds:
      - nix flake update --flake ./home-manager

  git-ignore:
    desc: Setup global gitignore
    cmds:
      - touch ~/.gitignore
      - git config --global core.excludesfile ~/.gitignore

  mise-setup:
    desc: Setup tools using mise (~/.config/mise/config.toml)
    cmds:
      - mise install

  mise-go-install:
    desc: Install Golang using mise
    cmds:
      - mise install go@{{.GO_VERSION}}

  mise-go-uninstall:
    desc: Uninstall Golang using mise
    cmds:
      - mise uninstall go@{{.GO_VERSION}}

  mise-go-ls:
    desc: List installed Golang versions
    cmds:
      - mise ls go

  mise-go-ls-remote:
    desc: List Golang versions ready for installation
    cmds:
      - mise ls-remote go

  mise-go-use-global:
    desc: Set global Golang version
    cmds:
      - mise use --global go@{{.GO_VERSION}}

  mise-go-use-local:
    desc: Set local Golang version. This would create .mist.toml
    cmds:
      - mise use go@{{.GO_VERSION}}

  mise-go-use-shell:
    desc: Set Golang version for the current session
    cmds:
      - mise shell go@{{.GO_VERSION}}
