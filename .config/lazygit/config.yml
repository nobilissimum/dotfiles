git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never

gui:
  mouseEvents: false
  sidePanelWidth: 0.3
  theme:
    activeBorderColor:
      - '#74add2'
      - bold
    inactiveBorderColor:
      - '#6c7077'
    selectedLineBgColor:
      - '#121c26'
      - bold
  showIcons: true
  nerdFontsVersion: '3'
  showFileIcons: true
  border: 'rounded'

os:
  editPreset: 'vim'
  copyToClipboardCmd: |-
    has() { command -v "$1" >/dev/null 2>&1; }

    if [ "$(uname)" = "Darwin" ] || { has pbcopy && has pbpaste; }; then
      printf '%s' {{text}} | pbcopy
    elif has xclip; then
      printf '%s' {{text}} | xclip -selection clipboard && kill -9 $(pgrep xclip)
    else
      echo "No suitable clipboard tool found" >&2
      exit 1
    fi
